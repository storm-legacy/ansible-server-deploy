---
- name: Ensure keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_ubuntu_gpg_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: ansible_distribution in ['Debian', 'Ubuntu']

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "{{ docker_ubuntu_repo_url }}"
    state: present
  when: ansible_distribution in ['Debian', 'Ubuntu']

- name: Install Docker
  ansible.builtin.apt:
    update_cache: true
    force_apt_get: true
    cache_valid_time: 86400
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: ansible_distribution in ['Debian', 'Ubuntu']

- name: Copy Docker configuration
  ansible.builtin.copy:
    src: "{{ role_path }}/files/daemon.json"
    dest: "/etc/docker/daemon.json"
    owner: "root"
    group: "docker"
    backup: true
    mode: "0640"
  notify:
    - Restart Docker service

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    append: true
    groups: "docker"
    state: present
  loop: "{{ docker_users }}"
  loop_control:
    label: "{{ item }}"

- name: Check if UFW is installed
  check_mode: true
  ansible.builtin.package:
    name: "ufw"
    state: "present"
  register: docker_ufw_check

- name: Check if UFW is enabled
  check_mode: true
  community.general.ufw:
    state: "enabled"
  register: docker_ufw_enabled_check

- name: Append ufw-docker rules to /etc/ufw/after.rules
  ansible.builtin.blockinfile:
    path: "/etc/ufw/after.rules"
    block: "{{ lookup('file', '{{ role_path }}/files/ufw-docker.rules') }}"
    insertbefore: EOF
  when: not docker_ufw_check.changed
  notify:
    - Restart UFW service
