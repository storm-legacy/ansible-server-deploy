docker_deb_architecture: {
  "aarch64": "arm64",
  "x86_64": "amd64"
}

docker_ubuntu_gpg_url: "https://download.docker.com/linux/ubuntu/gpg"
docker_ubuntu_repo_url: >
  deb [arch={{ docker_deb_architecture[ansible_architecture] }} signed-by=/etc/apt/keyrings/docker.asc]
  https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable

# Get users with `docker` group
docker_users: "{{ vault_docker_users }}"
