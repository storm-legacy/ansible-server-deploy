# Inspired by (simplified version)
# https://github.com/nickjj/ansible-swapfile/tree/master

# - name: Debug
#   ansible.builtin.debug:
#     var: ansible_facts.swaptotal_mb

- name: Swap already configured – skipping swapfile setup
  debug:
    msg: "Swap is already active on {{ inventory_hostname }} ({{ ansible_facts.swaptotal_mb }} MB), nothing to do."
  when: ansible_facts.swaptotal_mb > 0

- name: Setup swapfile
  when: ansible_facts.swaptotal_mb == 0
  block:
    - name: Check if swapfile exists
      ansible.builtin.stat:
        path: "{{ common_swapfile_path }}"
      register: swap_info
      ignore_errors: true

    - name: Create swapfile if it doesn't exist
      community.general.filesize:
        path: "{{ common_swapfile_path }}"
        size: "{{ common_swapfile_size }}M"
        mode: "0600"
        owner: "root"
        group: "root"
      when: not swap_info.stat.exists

    - name: Initialize swapfile
      community.general.filesystem:
        fstype: swap
        dev: "{{ common_swapfile_path }}"
        state: present

    - name: Manage swap file in /etc/fstab
      ansible.posix.mount:
        src: "{{ common_swapfile_path }}"
        path: "none"
        fstype: "swap"
        opts: "sw,nofail"
        dump: "0"
        passno: "0"
        state: "present"
        backup: true
