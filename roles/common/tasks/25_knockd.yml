---
- name: Install knockd package
  ansible.builtin.package:
    name: knockd
    state: present

- name: Deploy knockd configuration from template
  ansible.builtin.template:
    src: "{{ role_path }}/templates/knockd.conf.j2"
    dest: "/etc/knockd.conf"
    owner: root
    group: root
    mode: "0640"
    force: true
  vars:
    ssh_port: "{{ common_ssh_port }}"
    ssh_knock_seq: "{{ common_ssh_knock_seq }}"
  notify:
    - Restart knockd service

- name: Detect primary (default IPv4) interface name
  ansible.builtin.set_fact:
    common_knock_interface: "{{ ansible_default_ipv4.interface }}"

- name: Show me the interface name
  ansible.builtin.debug:
    msg: "Primary interface on {{ inventory_hostname }} is {{ common_knock_interface }}"

- name: Ensure knockd default interface is configured
  ansible.builtin.lineinfile:
    path: /etc/default/knockd
    regexp: "^KNOCKD_OPTS="
    line: 'KNOCKD_OPTS="-i {{ common_knock_interface }}"'
    insertafter: EOF
    create: false
  notify:
    - Restart knockd service

- name: Ensure knockd service is enabled and running
  ansible.builtin.service:
    name: knockd
    state: started
    enabled: true
