# Inspired by: https://github.com/limayne/ansible-disableservices/blob/main/main.yaml
---
- name: Disable unnecessary services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ common_services_disabled }}"
  notify:
    - Reboot systemd

- name: Enable specified services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ common_services_enabled }}"
  notify:
    - Reboot systemd
